name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check openjev_server tests
      - run: ruff format --check openjev_server tests
      - run: pytest -q tests  # the compat tests skip without a local tokenizer; the unit and server tests always run
